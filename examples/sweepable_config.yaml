# Bounds/values can be declared directly in the file instead of being
# attached afterward via set_bounds()/set_values() (see optuna_example.py
# for that alternative, load-then-annotate pattern). `type` is optional in
# a field's spec dict -- it's inferred from `default` when omitted.
dataset:
  name: oxe
  batch_size:
    default: 32
    bounds:
      min: 8
      max: 128
      step: 8

training:
  learning_rate:
    type: float
    default: 1.0e-4
    bounds:
      min: 1.0e-5
      max: 1.0e-2
      log: true
  optimizer:
    default: adam
    values: [adam, sgd]
  num_epochs: 100   # plain value: fixed, not sweepable
