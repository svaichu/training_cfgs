[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "training-cfgs"
version = "0.2.0a1"
description = "Standalone training configuration manager."
authors = [
    { name = "Vaishnavahari Seenivasan" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "optuna>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]

[tool.setuptools.packages.find]
include = ["training_cfgs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
